<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Nucleo convierte texto caótico, transcripciones y documentos en mapas de acción claros y estructurados." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#181A1F" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Nucleo</title>
    <script>
      (function () {
        document.documentElement.classList.add("dark");
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", "#181A1F");
        document
          .querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
          ?.setAttribute("content", "black-translucent");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
