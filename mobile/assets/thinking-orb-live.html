<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>thinking-orb live</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      /* Origin demo: shimmer on orb labels (transitions.dev). */
      :root {
        --shimmer-dur: 2000ms;
        --shimmer-band: 400%;
        --shimmer-ease: linear;
        --shimmer-base: rgba(251, 251, 251, 0.5);
        --shimmer-highlight: #ffffff;
      }
      html[data-theme='light'] {
        --shimmer-base: rgba(7, 7, 7, 0.45);
        --shimmer-highlight: #0d0d0d;
      }
      .t-shimmer {
        position: relative;
        display: inline-block;
        color: var(--shimmer-base);
        font-size: 15px;
        line-height: 20px;
        font-weight: 500;
        white-space: nowrap;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      .t-shimmer::before {
        content: attr(data-text);
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: linear-gradient(
          90deg,
          transparent 0%,
          transparent 40%,
          var(--shimmer-highlight) 50%,
          transparent 60%,
          transparent 100%
        );
        background-size: var(--shimmer-band) 100%;
        background-repeat: no-repeat;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        animation: t-shimmer var(--shimmer-dur) var(--shimmer-ease) infinite;
      }
      @keyframes t-shimmer {
        0% {
          background-position: 100% 0;
        }
        100% {
          background-position: 0% 0;
        }
      }
      .t-shimmer.is-paused::before {
        animation: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        .t-shimmer::before {
          animation: none !important;
        }
      }
    </style>
